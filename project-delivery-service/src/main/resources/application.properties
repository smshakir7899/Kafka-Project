spring.application.name=project-delivery-service

server.port=8082


# Kafka Broker
spring.kafka.bootstrap-servers=localhost:9092

# How to deserialize key and value
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

# JSON Deserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

# Consumer Group
spring.kafka.consumer.group-id=delivery-service-group


spring.datasource.url=jdbc:mysql://localhost:3306/ecom_kafka_project
spring.datasource.username=root
spring.datasource.password=Password@123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

spring.datasource.hikari.auto-commit=false

# ============================
# Topic names
# ============================
app.kafka.topic.payment-success=payment-success
app.kafka.topic.delivery-created=delivery-created
